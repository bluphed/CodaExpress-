<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no" />
    <title>Coda Express - Calculadora de Delivery</title>
    <link rel="manifest" href="/manifest.json" />
    <meta name="theme-color" content="#DE440D" />
    <link rel="icon" type="image/svg+xml" href="/icon.svg" />
    <link rel="apple-touch-icon" href="/icon.svg" />
    <link rel="manifest" href="CodaExpress/manifest.json">
    <link rel="icon" type="image/png" sizes="192x192" href="/Gabriel_CodaExpress/android-chrome-192x192.png">
  <link rel="icon" type="image/png" sizes="512x512" href="/Gabriel_CodaExpress/android-chrome-512x512.png">
  <link rel="apple-touch-icon" href="/Gabriel_CodaExpress/android-chrome-192x192.png">
  
  <title>Coda Express</title>
  
  <style>
    * {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
    }
    
    :root {
      --bg-primary: #f8fafc;
      --text-primary: #1e293b;
      --card-bg: #ffffff;
      --coda: #DE440D;
      --coda-dark: #b83a0a;
      --border: #e2e8f0;
    }
    
    .dark {
      --bg-primary: #0f172a;
      --text-primary: #f1f5f9;
      --card-bg: #1e293b;
      --border: #334155;
    }
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
    <script>
      if ('serviceWorker' in navigator) {
        window.addEventListener('load', () => {
          navigator.serviceWorker.register('/sw.js').then((registration) => {
            console.log('ServiceWorker registration successful with scope: ', registration.scope);
          }, (err) => {
            console.log('ServiceWorker registration failed: ', err);
          });
        });
      }
    </script>
  </body>
</html>

<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no" />
    <title>Coda Express - Calculadora de Delivery</title>
    <link rel="manifest" href="/manifest.json?v=17.0" />
    <meta name="theme-color" content="#DE440D" />
    <link rel="icon" type="image/png" sizes="192x192" href="/Gabriel_CodaExpress/android-chrome-192x192.png?v=17.0" />
    <link rel="icon" type="image/png" sizes="512x512" href="/Gabriel_CodaExpress/android-chrome-512x512.png?v=17.0" />
    <link rel="apple-touch-icon" href="/Gabriel_CodaExpress/apple-touch-icon.png?v=17.0" />



  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
    <script>
      // Function to force clear everything and reload
      window.forceUpdate = async () => {
        if ('serviceWorker' in navigator) {
          const registrations = await navigator.serviceWorker.getRegistrations();
          for (let registration of registrations) {
            await registration.unregister();
          }
        }
        if ('caches' in window) {
          const cacheNames = await caches.keys();
          for (let cacheName of cacheNames) {
            await caches.delete(cacheName);
          }
        }
        window.location.reload(true);
      };

      if ('serviceWorker' in navigator) {
        window.addEventListener('load', () => {
          navigator.serviceWorker.getRegistrations().then((registrations) => {
            let foundNew = false;
            for (let registration of registrations) {
              const url = registration.active?.scriptURL || registration.installing?.scriptURL || registration.waiting?.scriptURL;
              if (url && !url.includes('service-worker-v17.js')) {
                console.log('Unregistering old SW:', url);
                registration.unregister();
              } else if (url && url.includes('service-worker-v17.js')) {
                foundNew = true;
              }
            }
            
            if (!foundNew) {
              navigator.serviceWorker.register('/service-worker-v17.js').then((reg) => {
                console.log('New ServiceWorker registered:', reg.scope);
              }).catch(err => {
                console.error('ServiceWorker registration failed:', err);
              });
            }
          });
        });
      }
    </script>
  </body>
</html>

<svg width="512" height="512" viewBox="0 0 512 512" fill="none" xmlns="http://www.w3.org/2000/svg">
  <!-- Outer Circular Border -->
  <circle cx="256" cy="256" r="245" fill="white" stroke="black" stroke-width="12"/>
  <circle cx="256" cy="256" r="230" stroke="black" stroke-width="2" fill="none"/>
  
  <!-- Decorative Wreath Pattern (Simplified) -->
  <g transform="translate(256, 256)">
    <path d="M-210,0 A210,210 0 0,1 210,0" stroke="#333" stroke-width="15" stroke-dasharray="2,10" opacity="0.4"/>
    <path d="M-210,0 A210,210 0 0,0 210,0" stroke="#333" stroke-width="15" stroke-dasharray="2,10" opacity="0.4"/>
    <!-- Small leaf-like shapes -->
    <circle cx="-210" cy="0" r="5" fill="#333" opacity="0.5"/>
    <circle cx="210" cy="0" r="5" fill="#333" opacity="0.5"/>
    <circle cx="0" cy="-210" r="5" fill="#333" opacity="0.5"/>
    <circle cx="0" cy="210" r="5" fill="#333" opacity="0.5"/>
  </g>

  <!-- Dog Body/Neck -->
  <path d="M180 460C180 420 210 390 256 390C302 390 332 420 332 460" fill="#1A1A1A" stroke="black" stroke-width="2"/>

  <!-- Dog Head -->
  <path d="M256 410C325 410 380 355 380 280C380 205 325 150 256 150C187 150 132 205 132 280C132 355 187 410 256 410Z" fill="#1A1A1A" stroke="black" stroke-width="2"/>
  
  <!-- Ears -->
  <path d="M140 220C110 160 100 240 125 260" fill="#1A1A1A" stroke="black" stroke-width="2"/>
  <path d="M372 220C402 160 412 240 387 260" fill="#1A1A1A" stroke="black" stroke-width="2"/>
  
  <!-- Muzzle/Snout -->
  <ellipse cx="256" cy="345" rx="70" ry="55" fill="#D2B48C" stroke="black" stroke-width="2"/>
  <!-- Nose -->
  <path d="M256 315C242 315 232 325 232 335C232 345 242 355 256 355C270 355 280 345 280 335C280 325 270 315 256 315Z" fill="black"/>
  <!-- Mouth line -->
  <path d="M256 355V375M256 375C235 375 225 365 225 365M256 375C277 375 287 365 287 365" stroke="black" stroke-width="4" stroke-linecap="round"/>
  
  <!-- Eyes -->
  <circle cx="210" cy="285" r="32" fill="white" stroke="black" stroke-width="2"/>
  <circle cx="214" cy="282" r="14" fill="black"/>
  <circle cx="206" cy="276" r="5" fill="white"/>
  
  <circle cx="302" cy="285" r="32" fill="white" stroke="black" stroke-width="2"/>
  <circle cx="298" cy="282" r="14" fill="black"/>
  <circle cx="294" cy="276" r="5" fill="white"/>
  
  <!-- Red Cap -->
  <path d="M160 230C160 180 200 145 256 145C312 145 352 180 352 230H160Z" fill="#DE440D" stroke="black" stroke-width="2"/>
  <!-- Cap Brim -->
  <path d="M140 240C140 240 190 275 256 275C322 275 372 240 372 240L352 230H160L140 240Z" fill="#B03000" stroke="black" stroke-width="2"/>
  
  <!-- Wing Logo on Cap -->
  <g transform="translate(256, 185)">
    <circle r="12" fill="white"/>
    <path d="M-15,-5 C-25,-15 -35,-5 -35,-5 C-35,-5 -25,5 -15,5" fill="white"/>
    <path d="M15,-5 C25,-15 35,-5 35,-5 C35,-5 25,5 15,5" fill="white"/>
  </g>
</svg>
